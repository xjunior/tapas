[package]
name = "tapas"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Pulls a sample out of a MySQL or Postgres database into a SQL file or another database, keeping every reference intact"
readme = "README.md"
license = "MIT"
repository = "https://github.com/xjunior/tapas"
keywords = ["mysql", "postgres", "sampling", "test-data", "database"]
categories = ["command-line-utilities", "database"]
publish = false

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "env"] }
flate2 = "1.1.11"
futures-util = "0.3.34"
glob = "0.3.4"
indexmap = "2.14.2"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "webpki-roots"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
