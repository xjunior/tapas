name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Compiles every test once. The jobs below run what it archived, so nothing builds twice.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest archive --locked --archive-file tests.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: tests
          path: tests.tar.zst
          retention-days: 1

  # Everything that needs no database.
  unit:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: tests
      - run: >-
          cargo nextest run --archive-file tests.tar.zst --workspace-remap .
          -E 'not (binary(mysql) | binary(postgres))'

  mysql:
    needs: build
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tapas
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ptapas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TAPAS_TEST_DATABASE_URL: mysql://root:tapas@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: tests
      - run: cargo nextest run --archive-file tests.tar.zst --workspace-remap . -E 'binary(mysql)'

  postgres:
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: tapas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TAPAS_TEST_POSTGRES_URL: postgres://postgres:tapas@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: tests
      - run: cargo nextest run --archive-file tests.tar.zst --workspace-remap . -E 'binary(postgres)'

  # The oldest Rust that Cargo.toml promises.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
